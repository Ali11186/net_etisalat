name: Build Net Etisalat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Create Android Project
        run: flutter create --platforms android .

      - name: Configure Android
        run: |
          rm -f android/settings.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts

          mkdir -p assets/images
          mkdir -p android/app/src/main/kotlin/com/alaa/net_etisalat

          cat > android/settings.gradle <<'SETTINGS'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream {
                      properties.load(it)
                  }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.9.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "net_etisalat"
          include ":app"
          SETTINGS

          cat > android/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          cat > android/app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          android {
              namespace 'com.alaa.net_etisalat'
              compileSdk 36
              ndkVersion '28.2.13676358'

              defaultConfig {
                  applicationId 'com.alaa.net_etisalat'
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          flutter {
              source '../..'
          }
          APP

          cat > android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
          org.gradle.vfs.watch=false
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS

          cat > android/app/src/main/kotlin/com/alaa/net_etisalat/MainActivity.kt <<'KOTLIN'
          package com.alaa.net_etisalat

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          KOTLIN

      - name: Clean Flutter
        run: flutter clean

      - name: Flutter Pub Get After Clean
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-pub

      - name: Sign Release APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/net-etisalat-release.jks"

          test -f "$APK"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "android" \
            -keypass "android" \
            -alias "netetisalat" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Net Etisalat, OU=Android, O=Net Etisalat, L=Cairo, ST=Cairo, C=EG" \
            -noprompt

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias netetisalat \
            --out "$APK" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Locate APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-etisalat-release
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
